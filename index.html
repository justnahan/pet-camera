<!DOCTYPE html>
<html lang="zh-Hant">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>🐾 寵物監視器 (PetCam)</title>
    <meta name="description" content="長輩友善、免安裝的免費寵物監視器 Web App">
    <meta name="theme-color" content="#0F172A">
    <link rel="manifest" href="./manifest.json">
    <link rel="stylesheet" href="./css/style.css">

    <style>
        .home-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            gap: 2rem;
            text-align: center;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 1rem;
        }

        .subtitle {
            font-size: 1.25rem;
            color: #94A3B8;
            margin-bottom: 2rem;
            max-width: 80%;
        }

        .mode-button {
            width: 100%;
            max-width: 400px;
            padding: 2rem;
            font-size: 1.75rem;
            flex-direction: column;
            gap: 1rem;
        }

        .mode-button svg {
            width: 48px;
            height: 48px;
        }

        #settingsBtn {
            position: absolute;
            top: 20px;
            right: 20px;
            background: transparent;
            color: #94A3B8;
            font-size: 1rem;
            padding: 0.5rem;
        }
    </style>
</head>

<body>
    <button id="settingsBtn" onclick="setCameraId()">設定相機代碼</button>

    <main class="app-container home-container">
        <header>
            <h1>🐾 寵物監視器</h1>
            <p class="subtitle">請選擇這台裝置的功能</p>
        </header>

        <button class="mode-button" onclick="window.location.href='viewer.html'" aria-label="進入觀看模式（長輩手機使用）">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round"
                    d="m15.75 10.5 4.72-4.72a.75.75 0 0 1 1.28.53v11.38a.75.75 0 0 1-1.28.53l-4.72-4.72M4.5 18.75h9a2.25 2.25 0 0 0 2.25-2.25v-9a2.25 2.25 0 0 0-2.25-2.25h-9A2.25 2.25 0 0 0 2.25 7.5v9a2.25 2.25 0 0 0 2.25 2.25Z" />
            </svg>
            <span>📺 我要看貓咪</span>
            <small style="font-size: 1rem; font-weight: normal; opacity: 0.8;">長輩觀看端</small>
        </button>

        <button class="mode-button btn-success" onclick="window.location.href='camera.html'"
            aria-label="進入攝影機模式（舊手機使用）">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round"
                    d="M6.827 6.175A2.31 2.31 0 0 1 5.186 7.23c-.38.054-.757.112-1.134.175C2.999 7.58 2.25 8.507 2.25 9.574V18a2.25 2.25 0 0 0 2.25 2.25h15A2.25 2.25 0 0 0 21.75 18V9.574c0-1.067-.75-1.994-1.802-2.169a47.865 47.865 0 0 0-1.134-.175 2.31 2.31 0 0 1-1.64-1.055l-.822-1.316a2.192 2.192 0 0 0-1.736-1.039 48.774 48.774 0 0 0-5.232 0 2.192 2.192 0 0 0-1.736 1.039l-.821 1.316Z" />
                <path stroke-linecap="round" stroke-linejoin="round"
                    d="M16.5 12.75a4.5 4.5 0 1 1-9 0 4.5 4.5 0 0 1 9 0ZM18.75 10.5h.008v.008h-.008V10.5Z" />
            </svg>
            <span>📷 當作監視器</span>
            <small style="font-size: 1rem; font-weight: normal; opacity: 0.8;">舊手機攝影端</small>
        </button>
    </main>

    <script>
        function setCameraId() {
            let id = prompt("手動設定相機端代碼 (格式如 PET-XXXX)。如果是長輩使用，請代為設定好：", localStorage.getItem('petcam_target_id') || "");
            if (id) {
                id = id.trim().toUpperCase();
                if (!id.startsWith('PET-')) id = 'PET-' + id;
                localStorage.setItem('petcam_target_id', id);
                alert('已設定：' + id);
            }
        }

        // Register Service Worker for PWA
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js').then(registration => {
                    console.log('SW registered: ', registration);
                }).catch(registrationError => {
                    console.log('SW registration failed: ', registrationError);
                });
            });
        }
    </script>
</body>

</html>
