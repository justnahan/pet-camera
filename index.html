<!DOCTYPE html>
<html lang="zh-Hant">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>PetCam</title>
    <meta name="description" content="長輩友善、免安裝的免費寵物監視器">
    <meta name="theme-color" content="#0a0e1a">
    <link rel="manifest" href="./manifest.json">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent
        }

        :root {
            --bg: #0a0e1a;
            --surface: #131929;
            --surface2: #1e2d45;
            --primary: #3b82f6;
            --green: #10b981;
            --text: #f1f5f9;
            --muted: #64748b;
            --radius: 24px;
        }

        html,
        body {
            height: 100%;
            width: 100%;
            overflow: hidden;
            background: var(--bg);
            color: var(--text);
            font-family: 'Inter', sans-serif
        }

        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem 1.5rem;
            gap: 2rem;
            text-align: center
        }

        /* Ambient glow blobs */
        .blob {
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            opacity: .18;
            pointer-events: none;
            z-index: 0
        }

        .blob-blue {
            width: 320px;
            height: 320px;
            background: var(--primary);
            top: -80px;
            left: -80px
        }

        .blob-purple {
            width: 280px;
            height: 280px;
            background: #8b5cf6;
            bottom: -60px;
            right: -60px
        }

        /* Content wrapper */
        .content {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2rem;
            width: 100%;
            max-width: 400px
        }

        /* Logo */
        .logo {
            width: 88px;
            height: 88px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary), #8b5cf6);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 48px rgba(59, 130, 246, .4);
        }

        .logo svg {
            width: 46px;
            height: 46px;
            color: #fff
        }

        h1 {
            font-size: 2rem;
            font-weight: 900;
            letter-spacing: -.5px
        }

        .sub {
            color: var(--muted);
            font-size: .95rem
        }

        /* Mode cards */
        .cards {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            width: 100%
        }

        .card {
            width: 100%;
            padding: 1.4rem 1.5rem;
            border-radius: var(--radius);
            display: flex;
            align-items: center;
            gap: 1.25rem;
            text-align: left;
            border: 1px solid var(--surface2);
            cursor: pointer;
            transition: transform .15s, box-shadow .15s;
            text-decoration: none;
            color: var(--text);
        }

        .card:active {
            transform: scale(.975)
        }

        .card-viewer {
            background: linear-gradient(135deg, rgba(59, 130, 246, .15), rgba(59, 130, 246, .05));
            box-shadow: 0 0 28px rgba(59, 130, 246, .12);
        }

        .card-viewer:active {
            box-shadow: 0 0 12px rgba(59, 130, 246, .1)
        }

        .card-camera {
            background: linear-gradient(135deg, rgba(16, 185, 129, .15), rgba(16, 185, 129, .05));
            box-shadow: 0 0 28px rgba(16, 185, 129, .12);
        }

        .card-camera:active {
            box-shadow: 0 0 12px rgba(16, 185, 129, .1)
        }

        .card-icon {
            width: 56px;
            height: 56px;
            border-radius: 16px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .card-viewer .card-icon {
            background: rgba(59, 130, 246, .2)
        }

        .card-camera .card-icon {
            background: rgba(16, 185, 129, .2)
        }

        .card-icon svg {
            width: 30px;
            height: 30px
        }

        .card-viewer .card-icon svg {
            color: var(--primary)
        }

        .card-camera .card-icon svg {
            color: var(--green)
        }

        .card-text h2 {
            font-size: 1.15rem;
            font-weight: 700;
            margin-bottom: .2rem
        }

        .card-text p {
            font-size: .85rem;
            color: var(--muted);
            line-height: 1.4
        }

        .card-arrow {
            margin-left: auto;
            color: var(--muted);
            flex-shrink: 0
        }

        .card-arrow svg {
            width: 20px;
            height: 20px
        }
    </style>
</head>

<body>
    <div class="blob blob-blue"></div>
    <div class="blob blob-purple"></div>

    <div class="content">
        <div class="logo">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.8"
                stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round"
                    d="M12 6.75a.75.75 0 1 1 0-1.5.75.75 0 0 1 0 1.5ZM12 12.75a.75.75 0 1 1 0-1.5.75.75 0 0 1 0 1.5ZM12 18.75a.75.75 0 1 1 0-1.5.75.75 0 0 1 0 1.5Z" />
                <path stroke-linecap="round" stroke-linejoin="round"
                    d="M9 3.75H5.625A2.625 2.625 0 0 0 3 6.375v11.25A2.625 2.625 0 0 0 5.625 20.25H18.375A2.625 2.625 0 0 0 21 17.625V6.375A2.625 2.625 0 0 0 18.375 3.75H15M9 3.75a3 3 0 0 0 6 0M9 3.75a3 3 0 0 1 6 0" />
            </svg>
        </div>

        <div>
            <h1>PetCam</h1>
            <p class="sub">選擇這台裝置的功能</p>
        </div>

        <div class="cards">
            <!-- Viewer card -->
            <a href="viewer.html" class="card card-viewer">
                <div class="card-icon">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2"
                        stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round"
                            d="M2.036 12.322a1.012 1.012 0 0 1 0-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178Z" />
                        <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" />
                    </svg>
                </div>
                <div class="card-text">
                    <h2>觀看監視器</h2>
                    <p>在這台裝置查看貓咪即時畫面</p>
                </div>
                <div class="card-arrow">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5"
                        stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" d="m8.25 4.5 7.5 7.5-7.5 7.5" />
                    </svg>
                </div>
            </a>

            <!-- Camera card -->
            <a href="camera.html" class="card card-camera">
                <div class="card-icon">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2"
                        stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round"
                            d="m15.75 10.5 4.72-4.72a.75.75 0 0 1 1.28.53v11.38a.75.75 0 0 1-1.28.53l-4.72-4.72M4.5 18.75h9a2.25 2.25 0 0 0 2.25-2.25v-9A2.25 2.25 0 0 0 13.5 5.25h-9A2.25 2.25 0 0 0 2.25 7.5v9A2.25 2.25 0 0 0 4.5 18.75Z" />
                    </svg>
                </div>
                <div class="card-text">
                    <h2>設定為攝影機</h2>
                    <p>舊手機放置貓咪旁邊當監視器</p>
                </div>
                <div class="card-arrow">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5"
                        stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" d="m8.25 4.5 7.5 7.5-7.5 7.5" />
                    </svg>
                </div>
            </a>
        </div>
    </div>

    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js'));
        }
    </script>
</body>

</html>
