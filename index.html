<!DOCTYPE html>
<html lang="zh-Hant">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>PetCam</title>
    <meta name="description" content="長輩友善、免安裝的免費寵物監視器">
    <meta name="theme-color" content="#0a0e1a">
    <link rel="manifest" href="./manifest.json">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent
        }

        html,
        body {
            height: 100%;
            width: 100%;
            overflow: hidden;
            background: #0a0e1a;
            color: #f1f5f9;
            font-family: 'Inter', sans-serif;
        }

        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem 1.5rem;
            gap: 2rem;
            text-align: center;
        }

        /* Subtle ambient glow */
        .blob {
            position: fixed;
            border-radius: 50%;
            filter: blur(100px);
            opacity: .12;
            pointer-events: none;
            z-index: 0
        }

        .blob-blue {
            width: 300px;
            height: 300px;
            background: #3b82f6;
            top: -60px;
            left: -60px
        }

        .blob-purple {
            width: 260px;
            height: 260px;
            background: #8b5cf6;
            bottom: -40px;
            right: -40px
        }

        .content {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2rem;
            width: 100%;
            max-width: 400px
        }

        /* Logo */
        .logo {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 40px rgba(59, 130, 246, .35);
        }

        .logo svg {
            width: 42px;
            height: 42px;
            color: #fff
        }

        h1 {
            font-size: 2rem;
            font-weight: 900;
            letter-spacing: -.5px;
            color: #fff
        }

        .sub {
            color: #94a3b8;
            font-size: 1rem
        }

        /* HIGH CONTRAST CARDS — accessibility first */
        .cards {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            width: 100%
        }

        .card {
            width: 100%;
            border-radius: 20px;
            padding: 1.5rem;
            display: flex;
            align-items: center;
            gap: 1.25rem;
            text-decoration: none;
            cursor: pointer;
            border: none;
            font-family: 'Inter', sans-serif;
            text-align: left;
            transition: transform .15s, filter .15s;
        }

        .card:active {
            transform: scale(.975);
            filter: brightness(.92)
        }

        /* Viewer — solid white card, dark text = maximum contrast */
        .card-viewer {
            background: #ffffff;
            color: #0f172a;
            box-shadow: 0 4px 20px rgba(0, 0, 0, .35);
        }

        /* Camera — polished gradient, white text = high contrast */
        .card-camera {
            background: linear-gradient(135deg, #0d9488, #059669);
            color: #fff;
            box-shadow: 0 4px 20px rgba(13, 148, 136, .35);
        }

        .card-icon {
            width: 60px;
            height: 60px;
            border-radius: 16px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .card-viewer .card-icon {
            background: rgba(59, 130, 246, .12)
        }

        .card-camera .card-icon {
            background: rgba(255, 255, 255, .2)
        }

        .card-icon svg {
            width: 32px;
            height: 32px
        }

        .card-viewer .card-icon svg {
            color: #3b82f6
        }

        .card-camera .card-icon svg {
            color: #fff
        }

        .card-text {
            flex: 1
        }

        .card-text h2 {
            font-size: 1.2rem;
            font-weight: 800;
            margin-bottom: .25rem
        }

        .card-viewer .card-text h2 {
            color: #0f172a
        }

        .card-camera .card-text h2 {
            color: #fff
        }

        .card-text p {
            font-size: .9rem;
            line-height: 1.4
        }

        .card-viewer .card-text p {
            color: #475569
        }

        .card-camera .card-text p {
            color: rgba(255, 255, 255, .8)
        }

        .card-arrow svg {
            width: 22px;
            height: 22px;
            flex-shrink: 0
        }

        .card-viewer .card-arrow svg {
            color: #3b82f6
        }

        .card-camera .card-arrow svg {
            color: rgba(255, 255, 255, .7)
        }
    </style>
</head>

<body>
    <div class="blob blob-blue"></div>
    <div class="blob blob-purple"></div>

    <div class="content">
        <div class="logo">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.8"
                stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round"
                    d="M6.827 6.175A2.31 2.31 0 0 1 5.186 7.23c-.38.054-.757.112-1.134.175C2.999 7.58 2.25 8.507 2.25 9.574V18a2.25 2.25 0 0 0 2.25 2.25h15A2.25 2.25 0 0 0 21.75 18V9.574c0-1.067-.75-1.994-1.802-2.169a47.865 47.865 0 0 0-1.134-.175 2.31 2.31 0 0 1-1.64-1.055l-.822-1.316a2.192 2.192 0 0 0-1.736-1.039 48.774 48.774 0 0 0-5.232 0 2.192 2.192 0 0 0-1.736 1.039l-.821 1.316Z" />
                <path stroke-linecap="round" stroke-linejoin="round"
                    d="M16.5 12.75a4.5 4.5 0 1 1-9 0 4.5 4.5 0 0 1 9 0ZM18.75 10.5h.008v.008h-.008V10.5Z" />
            </svg>
        </div>

        <div>
            <h1>PetCam</h1>
            <p class="sub">選擇這台裝置的功能</p>
        </div>

        <div class="cards">
            <a href="viewer.html" class="card card-viewer" aria-label="進入觀看模式">
                <div class="card-icon">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.2"
                        stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round"
                            d="M2.036 12.322a1.012 1.012 0 0 1 0-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178Z" />
                        <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" />
                    </svg>
                </div>
                <div class="card-text">
                    <h2>觀看監視器</h2>
                    <p>查看貓咪即時畫面、呼叫貓咪</p>
                </div>
                <div class="card-arrow">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5"
                        stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" d="m8.25 4.5 7.5 7.5-7.5 7.5" />
                    </svg>
                </div>
            </a>

            <a href="camera.html" class="card card-camera" aria-label="進入攝影機模式">
                <div class="card-icon">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.2"
                        stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round"
                            d="m15.75 10.5 4.72-4.72a.75.75 0 0 1 1.28.53v11.38a.75.75 0 0 1-1.28.53l-4.72-4.72M4.5 18.75h9a2.25 2.25 0 0 0 2.25-2.25v-9A2.25 2.25 0 0 0 13.5 5.25h-9A2.25 2.25 0 0 0 2.25 7.5v9A2.25 2.25 0 0 0 4.5 18.75Z" />
                    </svg>
                </div>
                <div class="card-text">
                    <h2>設定為攝影機</h2>
                    <p>這台舊手機放在貓咪旁邊</p>
                </div>
                <div class="card-arrow">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5"
                        stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" d="m8.25 4.5 7.5 7.5-7.5 7.5" />
                    </svg>
                </div>
            </a>
        </div>
    </div>

    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js'));
        }
    </script>
</body>

</html>
