<!DOCTYPE html>
<html lang="zh-Hant">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>PetCam — 觀看</title>
    <meta name="theme-color" content="#0a0e1a">
    <link rel="manifest" href="./manifest.json">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent
        }

        :root {
            --bg: #0a0e1a;
            --surface: #131929;
            --surface2: #1e2d45;
            --primary: #3b82f6;
            --primary-d: #2563eb;
            --green: #10b981;
            --red: #ef4444;
            --amber: #f59e0b;
            --text: #f1f5f9;
            --muted: #64748b;
            --radius: 20px;
        }

        html,
        body {
            height: 100%;
            width: 100%;
            overflow: hidden;
            background: var(--bg);
            color: var(--text);
            font-family: 'Inter', sans-serif
        }

        /* ══ SETUP SCREEN ══ */
        #setupScreen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100dvh;
            width: 100%;
            padding: 2rem 1.5rem;
            gap: 1.75rem;
            text-align: center;
        }

        .logo-ring {
            width: 96px;
            height: 96px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary), #8b5cf6);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 40px rgba(59, 130, 246, .35);
        }

        .logo-ring svg {
            width: 50px;
            height: 50px;
            color: #fff
        }

        #setupScreen h1 {
            font-size: 1.8rem;
            font-weight: 900;
            letter-spacing: -.5px
        }

        #setupScreen p {
            color: var(--muted);
            font-size: .95rem
        }

        .id-input-row {
            width: 100%;
            max-width: 340px;
            display: flex;
            flex-direction: column;
            gap: .75rem
        }

        .id-input-label {
            font-size: .75rem;
            letter-spacing: .08em;
            text-transform: uppercase;
            color: var(--muted);
            text-align: left
        }

        #cameraIdInput {
            width: 100%;
            padding: 1rem 1.25rem;
            background: var(--surface);
            border: 2px solid var(--surface2);
            border-radius: 14px;
            color: var(--text);
            font-size: 1.6rem;
            font-family: 'Courier New', monospace;
            font-weight: 700;
            letter-spacing: .12em;
            text-align: center;
            text-transform: uppercase;
            outline: none;
            transition: border-color .2s;
        }

        #cameraIdInput:focus {
            border-color: var(--primary)
        }

        #cameraIdInput::placeholder {
            color: var(--muted);
            letter-spacing: .05em
        }

        .connect-btn {
            width: 100%;
            max-width: 340px;
            height: 68px;
            border-radius: 34px;
            background: linear-gradient(135deg, var(--primary), var(--primary-d));
            border: none;
            color: #fff;
            font-size: 1.15rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: .75rem;
            cursor: pointer;
            box-shadow: 0 8px 24px rgba(59, 130, 246, .35);
            transition: transform .15s, box-shadow .15s;
        }

        .connect-btn:active {
            transform: scale(.97);
            box-shadow: 0 4px 12px rgba(59, 130, 246, .25)
        }

        .connect-btn svg {
            width: 26px;
            height: 26px
        }

        .ghost-btn {
            background: transparent;
            border: 1px solid var(--surface2);
            color: var(--muted);
            border-radius: 12px;
            padding: .6rem 1rem;
            font-size: .9rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: .5rem;
        }

        .ghost-btn svg {
            width: 18px;
            height: 18px
        }

        /* ══ MAIN VIEWER ══ */
        #mainViewer {
            display: none;
            flex-direction: column;
            height: 100dvh;
            width: 100%;
        }

        /* Top bar */
        .top-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: .75rem 1rem;
            padding-top: max(.75rem, env(safe-area-inset-top));
            z-index: 10;
            flex-shrink: 0;
        }

        .icon-circle {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: var(--surface);
            border: 1px solid var(--surface2);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: var(--muted);
            transition: background .15s;
        }

        .icon-circle:active {
            background: var(--surface2)
        }

        .icon-circle svg {
            width: 22px;
            height: 22px
        }

        .status-pill {
            display: flex;
            align-items: center;
            gap: .5rem;
            padding: .4rem .9rem;
            border-radius: 999px;
            background: var(--surface);
            border: 1px solid var(--surface2);
            font-size: .85rem;
            font-weight: 600;
        }

        .dot {
            width: 9px;
            height: 9px;
            border-radius: 50%;
            background: var(--muted);
            flex-shrink: 0;
            transition: background .3s, box-shadow .3s
        }

        .dot.online {
            background: var(--green);
            box-shadow: 0 0 8px var(--green)
        }

        .dot.error {
            background: var(--red);
            box-shadow: 0 0 8px var(--red)
        }

        /* Video area */
        .video-area {
            flex: 1;
            position: relative;
            background: #000;
            overflow: hidden;
        }

        #remoteVideo {
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: #000;
            display: block;
        }

        /* Overlay */
        #videoOverlay {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 1.25rem;
            background: rgba(10, 14, 26, .85);
            backdrop-filter: blur(6px);
            z-index: 5;
        }

        .spinner {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            border: 5px solid rgba(255, 255, 255, .1);
            border-top-color: var(--primary);
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg)
            }
        }

        #overlayMessage {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--muted);
            text-align: center;
            line-height: 1.6
        }

        /* Talk button area */
        .bottom-bar {
            padding: 1rem 1.5rem;
            padding-bottom: max(1rem, env(safe-area-inset-bottom));
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        #talkButton {
            width: 100%;
            max-width: 480px;
            height: 100px;
            border-radius: 50px;
            background: linear-gradient(135deg, var(--green), #059669);
            border: none;
            color: #fff;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: .75rem;
            box-shadow: 0 8px 24px rgba(16, 185, 129, .3);
            transition: transform .1s, box-shadow .1s, background .1s;
            font-size: 1.15rem;
            font-weight: 700;
            font-family: 'Inter', sans-serif;
        }

        #talkButton svg {
            width: 34px;
            height: 34px;
            flex-shrink: 0
        }

        #talkButton.recording {
            background: linear-gradient(135deg, var(--red), #dc2626);
            box-shadow: 0 0 0 6px rgba(239, 68, 68, .25), 0 8px 24px rgba(239, 68, 68, .3);
            transform: scale(.97);
        }

        #talkButton:disabled {
            opacity: .4;
            cursor: not-allowed
        }
    </style>
</head>

<body>

    <!-- ══ SETUP SCREEN ══ -->
    <div id="setupScreen">
        <div class="logo-ring">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2"
                stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round"
                    d="M2.036 12.322a1.012 1.012 0 0 1 0-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178Z" />
                <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" />
            </svg>
        </div>

        <div>
            <h1>觀看監視器</h1>
            <p style="margin-top:.5rem">輸入攝影機畫面上的 ID</p>
        </div>

        <div class="id-input-row">
            <div class="id-input-label">攝影機 ID</div>
            <input id="cameraIdInput" type="text" placeholder="PET-XXXX" autocomplete="off" />
        </div>

        <button class="connect-btn" id="connectButton">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5"
                stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round"
                    d="m3.75 13.5 10.5-11.25L12 10.5h8.25L9.75 21.75 12 13.5H3.75Z" />
            </svg>
            開始觀看
        </button>

        <button class="ghost-btn" onclick="window.location.href='index.html'">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2"
                stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" d="M9 15 3 9m0 0 6-6M3 9h12a6 6 0 0 1 0 12h-3" />
            </svg>
            返回首頁
        </button>
    </div>

    <!-- ══ MAIN VIEWER ══ -->
    <div id="mainViewer">
        <div class="top-bar">
            <!-- Back button -->
            <button class="icon-circle" id="backButton" aria-label="返回">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2"
                    stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round"
                        d="M9 15 3 9m0 0 6-6M3 9h12a6 6 0 0 1 0 12h-3" />
                </svg>
            </button>

            <!-- Status pill -->
            <div class="status-pill">
                <div class="dot" id="statusDot"></div>
                <span id="statusText">連線中</span>
            </div>

            <!-- Switch ID button -->
            <button class="icon-circle" id="switchIdButton" aria-label="切換攝影機">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2"
                    stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round"
                        d="M16.023 9.348h4.992v-.001M2.985 19.644v-4.992m0 0h4.992m-4.993 0 3.181 3.183a8.25 8.25 0 0 0 13.803-3.7M4.031 9.865a8.25 8.25 0 0 1 13.803-3.7l3.181 3.182m0-4.991v4.99" />
                </svg>
            </button>
        </div>

        <div class="video-area">
            <video id="remoteVideo" autoplay muted playsinline webkit-playsinline></video>
            <div id="videoOverlay">
                <div class="spinner" id="loadingSpinner"></div>
                <div id="overlayMessage">等待攝影機連線...</div>
            </div>
        </div>

        <div class="bottom-bar">
            <button id="talkButton">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2"
                    stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round"
                        d="M12 18.75a6 6 0 0 0 6-6v-1.5m-6 7.5a6 6 0 0 1-6-6v-1.5m6 7.5v3.75m-3.75 0h7.5M12 15.75a3 3 0 0 1-3-3V4.5a3 3 0 1 1 6 0v8.25a3 3 0 0 1-3 3Z" />
                </svg>
                <span id="talkLabel">按住說話</span>
            </button>
        </div>
    </div>

    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <script src="./js/viewer.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js'));
        }
    </script>
</body>

</html>
