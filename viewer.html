<!DOCTYPE html>
<html lang="zh-Hant">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>PetCam — 觀看</title>
    <meta name="theme-color" content="#000">
    <link rel="manifest" href="./manifest.json">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent
        }

        html,
        body {
            height: 100%;
            width: 100%;
            overflow: hidden;
            background: #000;
            color: #fff;
            font-family: 'Inter', sans-serif
        }

        /* ─── SETUP SCREEN ─── */
        #setupScreen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100dvh;
            width: 100%;
            padding: 2rem 1.5rem;
            gap: 1.75rem;
            text-align: center;
            background: linear-gradient(160deg, #0c1220 0%, #0a0e1a 40%, #111827 100%);
        }

        .logo-ring {
            width: 88px;
            height: 88px;
            border-radius: 50%;
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 40px rgba(99, 102, 241, .35);
        }

        .logo-ring svg {
            width: 44px;
            height: 44px;
            color: #fff
        }

        #setupScreen h1 {
            font-size: 1.6rem;
            font-weight: 800;
            color: #fff
        }

        #setupScreen p {
            color: #94a3b8;
            font-size: .95rem
        }

        .id-input-row {
            width: 100%;
            max-width: 360px
        }

        .id-input-label {
            text-align: left;
            font-size: .85rem;
            color: #94a3b8;
            margin-bottom: .5rem;
            font-weight: 600
        }

        #cameraIdInput {
            width: 100%;
            padding: 1rem;
            border-radius: 14px;
            font-size: 1.2rem;
            font-family: 'Courier New', monospace;
            font-weight: 700;
            text-align: center;
            letter-spacing: 3px;
            background: rgba(255, 255, 255, .06);
            border: 1.5px solid rgba(255, 255, 255, .12);
            color: #fff;
            outline: none;
            text-transform: uppercase;
        }

        #cameraIdInput:focus {
            border-color: #6366f1;
            box-shadow: 0 0 0 3px rgba(99, 102, 241, .2)
        }

        .connect-btn {
            width: 100%;
            max-width: 360px;
            height: 64px;
            border-radius: 18px;
            border: none;
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            color: #fff;
            font-size: 1.15rem;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: .5rem;
            box-shadow: 0 6px 20px rgba(99, 102, 241, .35);
            font-family: 'Inter', sans-serif;
            transition: transform .12s;
        }

        .connect-btn:active {
            transform: scale(.97)
        }

        .connect-btn svg {
            width: 24px;
            height: 24px
        }

        .ghost-btn {
            background: transparent;
            border: 1px solid rgba(255, 255, 255, .12);
            color: #94a3b8;
            border-radius: 12px;
            padding: .6rem 1rem;
            font-size: .9rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: .5rem;
            font-family: 'Inter', sans-serif;
        }

        .ghost-btn svg {
            width: 18px;
            height: 18px
        }

        /* ─── VIEWER ─── */
        #mainViewer {
            display: none;
            flex-direction: column;
            height: 100dvh;
            width: 100%;
            background: #000
        }

        /* Floating top bar — transparent, over the video */
        .top-bar {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            z-index: 20;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 14px;
            padding-top: max(12px, env(safe-area-inset-top));
            background: linear-gradient(180deg, rgba(0, 0, 0, .55) 0%, transparent 100%);
            pointer-events: none;
        }

        .top-bar>* {
            pointer-events: auto
        }

        .top-icon {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: rgba(255, 255, 255, .12);
            backdrop-filter: blur(8px);
            border: none;
            cursor: pointer;
            color: rgba(255, 255, 255, .85);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background .15s;
        }

        .top-icon:active {
            background: rgba(255, 255, 255, .25)
        }

        .top-icon svg {
            width: 20px;
            height: 20px
        }

        .status-chip {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 6px 14px;
            border-radius: 999px;
            background: rgba(0, 0, 0, .45);
            backdrop-filter: blur(8px);
            font-size: .8rem;
            font-weight: 600;
            color: rgba(255, 255, 255, .85);
        }

        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #475569
        }

        .dot.online {
            background: #22c55e;
            box-shadow: 0 0 6px rgba(34, 197, 94, .6)
        }

        .dot.error {
            background: #ef4444;
            box-shadow: 0 0 6px rgba(239, 68, 68, .5)
        }

        /* Video — full screen */
        .video-area {
            flex: 1;
            position: relative;
            background: #000;
            overflow: hidden
        }

        #remoteVideo {
            width: 100%;
            height: 100%;
            object-fit: cover
        }

        #videoOverlay {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 1.25rem;
            background: rgba(0, 0, 0, .7);
            backdrop-filter: blur(4px);
            z-index: 5;
        }

        .spinner {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            border: 4px solid rgba(255, 255, 255, .08);
            border-top-color: #6366f1;
            animation: spin .8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg)
            }
        }

        #overlayMessage {
            font-size: 1rem;
            font-weight: 600;
            color: rgba(255, 255, 255, .6);
            text-align: center;
            line-height: 1.6
        }

        /* Talk button — bottom, rounded pill */
        .bottom-bar {
            padding: 12px 20px;
            padding-bottom: max(12px, env(safe-area-inset-bottom));
            background: linear-gradient(0deg, rgba(0, 0, 0, .6) 0%, transparent 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 20;
        }

        #talkButton {
            width: 100%;
            max-width: 360px;
            height: 72px;
            border-radius: 36px;
            background: linear-gradient(135deg, #6366f1, #7c3aed);
            border: none;
            color: #fff;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: .6rem;
            box-shadow: 0 6px 24px rgba(99, 102, 241, .35);
            transition: transform .1s, box-shadow .1s;
            font-size: 1.05rem;
            font-weight: 700;
            font-family: 'Inter', sans-serif;
        }

        #talkButton:active {
            transform: scale(.96);
            box-shadow: 0 2px 12px rgba(99, 102, 241, .2)
        }

        #talkButton svg {
            width: 28px;
            height: 28px;
            flex-shrink: 0
        }

        #talkButton.recording {
            background: linear-gradient(135deg, #dc2626, #ef4444);
            box-shadow: 0 6px 24px rgba(239, 68, 68, .4);
            animation: pulse 1.2s ease-in-out infinite;
        }

        @keyframes pulse {

            0%,
            100% {
                transform: scale(1)
            }

            50% {
                transform: scale(1.03)
            }
        }
    </style>
</head>

<body>

    <!-- ═══ SETUP SCREEN ═══ -->
    <div id="setupScreen">
        <div class="logo-ring">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2"
                stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round"
                    d="M2.036 12.322a1.012 1.012 0 0 1 0-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178Z" />
                <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" />
            </svg>
        </div>
        <div>
            <h1>觀看監視器</h1>
            <p style="margin-top:.5rem">輸入攝影機畫面上的 ID</p>
        </div>
        <div class="id-input-row">
            <div class="id-input-label">攝影機 ID</div>
            <input id="cameraIdInput" type="text" placeholder="PET-XXXX" autocomplete="off" />
        </div>
        <button class="connect-btn" id="connectButton">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5"
                stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round"
                    d="m3.75 13.5 10.5-11.25L12 10.5h8.25L9.75 21.75 12 13.5H3.75Z" />
            </svg>
            開始觀看
        </button>
        <button class="ghost-btn" onclick="window.location.href='index.html'">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2"
                stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" d="M9 15 3 9m0 0 6-6M3 9h12a6 6 0 0 1 0 12h-3" />
            </svg>
            返回首頁
        </button>
    </div>

    <!-- ═══ MAIN VIEWER ═══ -->
    <div id="mainViewer">
        <!-- Floating top bar (over video) -->
        <div class="top-bar">
            <button class="top-icon" type="button" onclick="window.location.href='index.html'" aria-label="返回">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.2"
                    stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 19.5 8.25 12l7.5-7.5" />
                </svg>
            </button>
            <div class="status-chip">
                <div class="dot" id="statusDot"></div>
                <span id="statusText">連線中</span>
            </div>
            <button class="top-icon" type="button" id="flipCamBtn" onclick="sendFlipCommand()" aria-label="切換鏡頭">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.2"
                    stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round"
                        d="M16.023 9.348h4.992v-.001M2.985 19.644v-4.992m0 0h4.992m-4.993 0 3.181 3.183a8.25 8.25 0 0 0 13.803-3.7M4.031 9.865a8.25 8.25 0 0 1 13.803-3.7l3.181 3.182m0-4.991v4.99" />
                </svg>
            </button>
        </div>

        <!-- Full-screen video -->
        <div class="video-area">
            <video id="remoteVideo" autoplay muted playsinline webkit-playsinline></video>
            <div id="videoOverlay">
                <div class="spinner" id="loadingSpinner"></div>
                <div id="overlayMessage">等待攝影機連線...</div>
            </div>
        </div>

        <!-- Floating talk button (over video bottom) -->
        <div class="bottom-bar">
            <button id="talkButton" type="button">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2"
                    stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round"
                        d="M12 18.75a6 6 0 0 0 6-6v-1.5m-6 7.5a6 6 0 0 1-6-6v-1.5m6 7.5v3.75m-3.75 0h7.5M12 15.75a3 3 0 0 1-3-3V4.5a3 3 0 1 1 6 0v8.25a3 3 0 0 1-3 3Z" />
                </svg>
                <span id="talkLabel">按住說話</span>
            </button>
        </div>
    </div>

    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <script src="./js/viewer.js"></script>
    <script>
        function sendFlipCommand() {
            var camId = localStorage.getItem('petcam_target_id');
            if (!camId || !window._viewerPeer) { return; }
            var conn = window._viewerPeer.connect(camId);
            conn.on('open', function () { conn.send('flip'); });
            var btn = document.getElementById('flipCamBtn');
            if (btn) { btn.style.opacity = '0.5'; setTimeout(function () { btn.style.opacity = '1'; }, 400); }
        }
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js'));
        }
    </script>
</body>

</html>
