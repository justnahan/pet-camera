<!DOCTYPE html>
<html lang="zh-Hant">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>PetCam — 觀看</title>
    <meta name="theme-color" content="#000">
    <link rel="manifest" href="./manifest.json">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent
        }

        html,
        body {
            height: 100%;
            width: 100%;
            overflow: hidden;
            background: #000;
            color: #fff;
            font-family: 'Inter', sans-serif
        }

        /* ─── SETUP SCREEN ─── */
        #setupScreen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100dvh;
            width: 100%;
            padding: 2rem 1.5rem;
            gap: 1.75rem;
            text-align: center;
            background: linear-gradient(160deg, #0c1220 0%, #0a0e1a 40%, #111827 100%);
        }

        .logo-ring {
            width: 88px;
            height: 88px;
            border-radius: 50%;
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 40px rgba(99, 102, 241, .35);
        }

        .logo-ring svg {
            width: 44px;
            height: 44px;
            color: #fff
        }

        #setupScreen h1 {
            font-size: 1.6rem;
            font-weight: 800;
            color: #fff
        }

        #setupScreen p {
            color: #94a3b8;
            font-size: .95rem
        }

        .id-input-row {
            width: 100%;
            max-width: 360px
        }

        .id-input-label {
            text-align: left;
            font-size: .85rem;
            color: #94a3b8;
            margin-bottom: .5rem;
            font-weight: 600
        }

        #cameraIdInput {
            width: 100%;
            padding: 1rem;
            border-radius: 14px;
            font-size: 1.2rem;
            font-family: 'Courier New', monospace;
            font-weight: 700;
            text-align: center;
            letter-spacing: 3px;
            background: rgba(255, 255, 255, .06);
            border: 1.5px solid rgba(255, 255, 255, .12);
            color: #fff;
            outline: none;
            text-transform: uppercase;
        }

        #cameraIdInput:focus {
            border-color: #6366f1;
            box-shadow: 0 0 0 3px rgba(99, 102, 241, .2)
        }

        .connect-btn {
            width: 100%;
            max-width: 360px;
            height: 64px;
            border-radius: 18px;
            border: none;
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            color: #fff;
            font-size: 1.15rem;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: .5rem;
            box-shadow: 0 6px 20px rgba(99, 102, 241, .35);
            font-family: 'Inter', sans-serif;
            transition: transform .12s;
        }

        .connect-btn:active {
            transform: scale(.97)
        }

        .connect-btn svg {
            width: 24px;
            height: 24px
        }

        .ghost-btn {
            background: transparent;
            border: 1px solid rgba(255, 255, 255, .12);
            color: #94a3b8;
            border-radius: 12px;
            padding: .6rem 1rem;
            font-size: .9rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: .5rem;
            font-family: 'Inter', sans-serif;
        }

        .ghost-btn svg {
            width: 18px;
            height: 18px
        }

        /* ─── VIEWER ─── */
        #mainViewer {
            display: none;
            flex-direction: column;
            height: 100dvh;
            width: 100%;
            background: #000
        }

        /* Pinch-to-zoom */
        .video-area {
            flex: 1;
            position: relative;
            background: #000;
            overflow: hidden;
            touch-action: none
        }

        #remoteVideo {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform-origin: center center;
            transition: transform .05s linear
        }

        /* Screenshot flash */
        .flash {
            position: absolute;
            inset: 0;
            background: #fff;
            opacity: 0;
            z-index: 30;
            pointer-events: none
        }

        .flash.active {
            animation: flashAnim .3s ease-out
        }

        @keyframes flashAnim {
            0% {
                opacity: .7
            }

            100% {
                opacity: 0
            }
        }

        /* Toast notification */
        .toast {
            position: fixed;
            bottom: 120px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 99;
            background: rgba(0, 0, 0, .8);
            backdrop-filter: blur(8px);
            color: #fff;
            padding: 10px 20px;
            border-radius: 12px;
            font-size: .85rem;
            font-weight: 600;
            opacity: 0;
            transition: opacity .25s;
            pointer-events: none
        }

        .toast.show {
            opacity: 1
        }

        /* Floating top bar — transparent, over the video */
        .top-bar {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            z-index: 20;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 14px;
            padding-top: max(12px, env(safe-area-inset-top));
            background: linear-gradient(180deg, rgba(0, 0, 0, .55) 0%, transparent 100%);
            pointer-events: none;
        }

        .top-bar>* {
            pointer-events: auto
        }

        .top-icon {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: rgba(255, 255, 255, .12);
            backdrop-filter: blur(8px);
            border: none;
            cursor: pointer;
            color: rgba(255, 255, 255, .85);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background .15s;
        }

        .top-icon:active {
            background: rgba(255, 255, 255, .25)
        }

        .top-icon svg {
            width: 20px;
            height: 20px
        }

        .status-chip {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 6px 14px;
            border-radius: 999px;
            background: rgba(0, 0, 0, .45);
            backdrop-filter: blur(8px);
            font-size: .8rem;
            font-weight: 600;
            color: rgba(255, 255, 255, .85);
        }

        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #475569
        }

        .dot.online {
            background: #22c55e;
            box-shadow: 0 0 6px rgba(34, 197, 94, .6)
        }

        .dot.error {
            background: #ef4444;
            box-shadow: 0 0 6px rgba(239, 68, 68, .5)
        }

        /* Video — full screen */
        .video-area {
            flex: 1;
            position: relative;
            background: #000;
            overflow: hidden
        }

        #remoteVideo {
            width: 100%;
            height: 100%;
            object-fit: cover
        }

        #videoOverlay {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 1.25rem;
            background: rgba(0, 0, 0, .7);
            backdrop-filter: blur(4px);
            z-index: 5;
        }

        .spinner {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            border: 4px solid rgba(255, 255, 255, .08);
            border-top-color: #6366f1;
            animation: spin .8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg)
            }
        }

        #overlayMessage {
            font-size: 1rem;
            font-weight: 600;
            color: rgba(255, 255, 255, .6);
            text-align: center;
            line-height: 1.6
        }

        /* Talk button — bottom, rounded pill */
        .bottom-bar {
            padding: 12px 20px;
            padding-bottom: max(12px, env(safe-area-inset-bottom));
            background: linear-gradient(0deg, rgba(0, 0, 0, .6) 0%, transparent 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 20;
        }

        #talkButton {
            width: 100%;
            max-width: 360px;
            height: 72px;
            border-radius: 36px;
            background: linear-gradient(135deg, #6366f1, #7c3aed);
            border: none;
            color: #fff;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: .6rem;
            box-shadow: 0 6px 24px rgba(99, 102, 241, .35);
            transition: transform .1s, box-shadow .1s;
            font-size: 1.05rem;
            font-weight: 700;
            font-family: 'Inter', sans-serif;
        }

        #talkButton:active {
            transform: scale(.96);
            box-shadow: 0 2px 12px rgba(99, 102, 241, .2)
        }

        #talkButton svg {
            width: 28px;
            height: 28px;
            flex-shrink: 0
        }

        #talkButton.recording {
            background: linear-gradient(135deg, #dc2626, #ef4444);
            box-shadow: 0 6px 24px rgba(239, 68, 68, .4);
            animation: pulse 1.2s ease-in-out infinite;
        }

        @keyframes pulse {

            0%,
            100% {
                transform: scale(1)
            }

            50% {
                transform: scale(1.03)
            }
        }
    </style>
</head>

<body>

    <!-- ═══ SETUP SCREEN ═══ -->
    <div id="setupScreen">
        <div class="logo-ring">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2"
                stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round"
                    d="M2.036 12.322a1.012 1.012 0 0 1 0-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178Z" />
                <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" />
            </svg>
        </div>
        <div>
            <h1>觀看監視器</h1>
        </div>
        <div class="id-input-row">
            <div class="id-input-label">攝影機 ID</div>
            <input id="cameraIdInput" type="text" placeholder="PET-XXXX" autocomplete="off" />
        </div>
        <button class="connect-btn" id="connectButton">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5"
                stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round"
                    d="m3.75 13.5 10.5-11.25L12 10.5h8.25L9.75 21.75 12 13.5H3.75Z" />
            </svg>
            開始觀看
        </button>
        <button class="ghost-btn" onclick="window.location.href='index.html'">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2"
                stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" d="M9 15 3 9m0 0 6-6M3 9h12a6 6 0 0 1 0 12h-3" />
            </svg>
            返回首頁
        </button>
    </div>

    <!-- ═══ MAIN VIEWER ═══ -->
    <div id="mainViewer">
        <!-- Floating top bar -->
        <div class="top-bar">
            <button class="top-icon" type="button" onclick="window.location.href='index.html'" aria-label="返回">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.2"
                    stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 19.5 8.25 12l7.5-7.5" />
                </svg>
            </button>
            <div class="status-chip">
                <div class="dot" id="statusDot"></div>
                <span id="statusText">連線中</span>
            </div>
            <div style="display:flex;gap:8px">
                <button class="top-icon" type="button" id="dimCamBtn" onclick="sendDimCommand()" aria-label="讓攝影機休眠">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.2"
                        stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round"
                            d="M21.752 15.002A9.72 9.72 0 0 1 18 15.75c-5.385 0-9.75-4.365-9.75-9.75 0-1.33.266-2.597.748-3.752A9.753 9.753 0 0 0 3 11.25C3 16.635 7.365 21 12.75 21a9.753 9.753 0 0 0 9.002-5.998Z" />
                    </svg>
                </button>
                <button class="top-icon" type="button" onclick="takeScreenshot()" aria-label="截圖">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.2"
                        stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round"
                            d="M6.827 6.175A2.31 2.31 0 0 1 5.186 7.23c-.38.054-.757.112-1.134.175C2.999 7.58 2.25 8.507 2.25 9.574V18a2.25 2.25 0 0 0 2.25 2.25h15A2.25 2.25 0 0 0 21.75 18V9.574c0-1.067-.75-1.994-1.802-2.169a47.865 47.865 0 0 0-1.134-.175 2.31 2.31 0 0 1-1.64-1.055l-.822-1.316a2.192 2.192 0 0 0-1.736-1.039 48.774 48.774 0 0 0-5.232 0 2.192 2.192 0 0 0-1.736 1.039l-.821 1.316Z" />
                        <path stroke-linecap="round" stroke-linejoin="round"
                            d="M16.5 12.75a4.5 4.5 0 1 1-9 0 4.5 4.5 0 0 1 9 0Z" />
                    </svg>
                </button>
                <button class="top-icon" type="button" id="flipCamBtn" onclick="sendFlipCommand()" aria-label="切換鏡頭">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.2"
                        stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round"
                            d="M16.023 9.348h4.992v-.001M2.985 19.644v-4.992m0 0h4.992m-4.993 0 3.181 3.183a8.25 8.25 0 0 0 13.803-3.7M4.031 9.865a8.25 8.25 0 0 1 13.803-3.7l3.181 3.182m0-4.991v4.99" />
                    </svg>
                </button>
            </div>
        </div>

        <!-- Full-screen video with pinch-to-zoom -->
        <div class="video-area" id="videoArea">
            <video id="remoteVideo" autoplay muted playsinline webkit-playsinline></video>
            <div id="videoOverlay">
                <div class="spinner" id="loadingSpinner"></div>
                <div id="overlayMessage">等待攝影機連線...</div>
            </div>
            <div class="flash" id="flashOverlay"></div>
        </div>

        <!-- Floating talk button -->
        <div class="bottom-bar">
            <button id="talkButton" type="button">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2"
                    stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round"
                        d="M12 18.75a6 6 0 0 0 6-6v-1.5m-6 7.5a6 6 0 0 1-6-6v-1.5m6 7.5v3.75m-3.75 0h7.5M12 15.75a3 3 0 0 1-3-3V4.5a3 3 0 1 1 6 0v8.25a3 3 0 0 1-3 3Z" />
                </svg>
                <span id="talkLabel">按住說話</span>
            </button>
        </div>

        <div class="toast" id="toast"></div>
    </div>

    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <script src="./js/viewer.js"></script>
    <script>
        // ─── Send flip command ───
        function sendFlipCommand() {
            var camId = localStorage.getItem('petcam_target_id');
            if (!camId || !window._viewerPeer) return;
            var conn = window._viewerPeer.connect(camId);
            conn.on('open', function () { conn.send('flip'); });
            var btn = document.getElementById('flipCamBtn');
            if (btn) { btn.style.opacity = '0.5'; setTimeout(function () { btn.style.opacity = '1'; }, 400); }
        }

        // ─── Send dim command ───
        function sendDimCommand() {
            var camId = localStorage.getItem('petcam_target_id');
            if (!camId || !window._viewerPeer) return;
            var conn = window._viewerPeer.connect(camId);
            conn.on('open', function () { conn.send('dim'); });
            var btn = document.getElementById('dimCamBtn');
            if (btn) { btn.style.opacity = '0.5'; setTimeout(function () { btn.style.opacity = '1'; }, 400); }
            showToast('切換攝影機節電模式');
        }

        // ─── Screenshot ───
        function takeScreenshot() {
            var video = document.getElementById('remoteVideo');
            if (!video || !video.videoWidth) { showToast('尚無影像'); return; }
            var canvas = document.createElement('canvas');
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            canvas.getContext('2d').drawImage(video, 0, 0);
            // Flash effect
            var flash = document.getElementById('flashOverlay');
            if (flash) { flash.classList.remove('active'); void flash.offsetWidth; flash.classList.add('active'); }
            // Download
            var link = document.createElement('a');
            var now = new Date();
            var ts = now.getFullYear() + ('0' + (now.getMonth() + 1)).slice(-2) + ('0' + now.getDate()).slice(-2) + '_' + ('0' + now.getHours()).slice(-2) + ('0' + now.getMinutes()).slice(-2) + ('0' + now.getSeconds()).slice(-2);
            link.download = 'PetCam_' + ts + '.png';
            link.href = canvas.toDataURL('image/png');
            link.click();
            showToast('已儲存截圖');
        }

        // ─── Toast ───
        function showToast(msg) {
            var t = document.getElementById('toast');
            if (!t) return;
            t.textContent = msg;
            t.classList.add('show');
            setTimeout(function () { t.classList.remove('show'); }, 1800);
        }

        // ─── Pinch-to-Zoom ───
        (function () {
            var area = document.getElementById('videoArea');
            var video = document.getElementById('remoteVideo');
            if (!area || !video) return;
            var scale = 1, lastScale = 1, startDist = 0;
            var panX = 0, panY = 0, startPanX = 0, startPanY = 0;
            var midX = 0, midY = 0;

            function getDist(touches) {
                var dx = touches[0].clientX - touches[1].clientX;
                var dy = touches[0].clientY - touches[1].clientY;
                return Math.sqrt(dx * dx + dy * dy);
            }
            function getMid(touches) {
                return { x: (touches[0].clientX + touches[1].clientX) / 2, y: (touches[0].clientY + touches[1].clientY) / 2 };
            }
            function applyTransform() {
                var s = Math.max(1, Math.min(scale, 5));
                scale = s;
                video.style.transform = 'scale(' + s + ') translate(' + panX + 'px,' + panY + 'px)';
            }

            area.addEventListener('touchstart', function (e) {
                if (e.touches.length === 2) {
                    e.preventDefault();
                    startDist = getDist(e.touches);
                    lastScale = scale;
                    var m = getMid(e.touches);
                    midX = m.x; midY = m.y;
                    startPanX = panX; startPanY = panY;
                }
            }, { passive: false });

            area.addEventListener('touchmove', function (e) {
                if (e.touches.length === 2) {
                    e.preventDefault();
                    var dist = getDist(e.touches);
                    scale = lastScale * (dist / startDist);
                    var m = getMid(e.touches);
                    panX = startPanX + (m.x - midX) / scale;
                    panY = startPanY + (m.y - midY) / scale;
                    applyTransform();
                }
            }, { passive: false });

            area.addEventListener('touchend', function (e) {
                if (e.touches.length < 2) {
                    if (scale <= 1.05) { scale = 1; panX = 0; panY = 0; applyTransform(); }
                }
            });

            // Double-tap to reset zoom
            var lastTap = 0;
            area.addEventListener('touchend', function (e) {
                if (e.touches.length > 0) return;
                var now = Date.now();
                if (now - lastTap < 300 && scale > 1) {
                    scale = 1; panX = 0; panY = 0;
                    video.style.transition = 'transform .25s ease';
                    applyTransform();
                    setTimeout(function () { video.style.transition = 'transform .05s linear'; }, 300);
                }
                lastTap = now;
            });
        })();

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', function () { navigator.serviceWorker.register('./sw.js'); });
        }
    </script>
</body>

</html>
